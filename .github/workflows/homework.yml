name: ДЗ · Первый урожай
on:
  push:
    branches: [main]
    paths: ['lesson4/homework/**', '.github/workflows/homework.yml']
  pull_request:
    branches: [main]
    paths: ['lesson4/homework/**', '.github/workflows/homework.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  garden:
    name: Проверка сада
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
      - name: Тесты поведения
        run: ./System/gradlew --no-daemon --console=plain -p "lesson4/homework" test

name: Семинар 4

on:
  push:
    branches: [main, seminar4-current]
  pull_request:
    branches: [main]
    paths:
      - 'lesson4/seminar/**'
      - '.run/**'
      - '.github/workflows/seminar-4.yml'
      - '.github/scripts/**'
      - 'gradle/**'
      - 'gradlew*'
      - 'settings.gradle.kts'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    # The upstream default branch intentionally contains unfinished exercises.
    if: github.repository != 'TimofeyYA1/FD2026' || github.event_name != 'push'
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        suite: [Task01Test, Task02Test, Task03Test, Task04Test, Task05Test]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
      - name: Сборка и запуск
        env:
          SUITE: ${{ matrix.suite }}
        run: ./gradlew --no-daemon --console=plain -q :seminar-4:test --tests "*$SUITE"
      - name: Результаты тестов
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/results.py '${{ matrix.suite }}'

  smoke:
    name: ${{ matrix.os }} · запуск и сборка тестов
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wrapper: ./gradlew
          - os: windows-latest
            wrapper: .\gradlew.bat
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
      - name: Запустить примеры и собрать тесты
        shell: pwsh
        env:
          WRAPPER: ${{ matrix.wrapper }}
        run: |
          $tasks = @(':prepareKotlinBuildScriptModel', ':seminar-4:prepareKotlinBuildScriptModel', ':seminar-4:testClasses')
          if ($env:GITHUB_REPOSITORY -eq 'TimofeyYA1/FD2026' -and $env:GITHUB_EVENT_NAME -eq 'push') {
            $tasks += @(1..9 | ForEach-Object { ':seminar-4:runTask{0:00}' -f $_ })
          }
          & $env:WRAPPER --no-daemon --console=plain @tasks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
